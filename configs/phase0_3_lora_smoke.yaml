artifact_version: phase0.3d1-qwen3vl-lora-smoke-v0.1
artifact_schema_version: phase0_3d1_qwen3vl_lora_smoke_v0.1
prompt_version: phase0.3c-zero-shot-v0.1
parser_version: phase0.3a2-strict-legacy-action-v0.1
generation_config_version: phase0.3a2-deterministic-generation-v0.1

model_id: Qwen/Qwen3-VL-4B-Instruct
model_revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
processor_revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
dtype_preference: bfloat16
attention_implementation: sdpa
device: cuda:0
local_files_only: false

input_variant: image_ego_state
optimization_split: train
evaluation_split: validation
allowed_actions:
  - keep
  - accelerate
  - decelerate
  - stop
  - left_lateral
  - right_lateral

task_prompt: |-
  Based only on the provided current observation, predict the ego vehicle's
  near-future coarse driving action.

  Choose exactly one action from:

  keep
  accelerate
  decelerate
  stop
  left_lateral
  right_lateral

  Output exactly the action name and nothing else.

adapter:
  relative_dir: phase_0_3/qwen3vl_dataset_adapter_v0_1
  receipt_relative_path: adapter_receipt.json
  config_relative_path: configs/phase0_3_dataset_adapter.yaml
  config_sha256: 5a28a0528b291e9623bb3a40cacfc76f8822e0ca9e420818a034b6c530bd71ba
  version: phase0.3b-qwen3vl-dataset-adapter-v0.1
  schema_version: phase0_3_qwen3vl_dataset_adapter_v0.1
  train_record_count: 14253
  validation_record_count: 3594
  train_files:
    image_only: train_image_only.jsonl
    image_ego_state: train_image_ego_state.jsonl
  validation_files:
    image_only: validation_image_only.jsonl
    image_ego_state: validation_image_ego_state.jsonl

selection:
  train_subset_size: 12
  validation_subset_size: 6
  seed: 20260812
  tiny_overfit: true

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 20
  learning_rate: 0.0002
  gradient_checkpointing: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

generation_kwargs:
  do_sample: false
  num_beams: 1
  max_new_tokens: 16
retry_count: 0

output_relative_dir: phase_0_3/qwen3vl_lora_smoke_v0_1
checkpoint_dirname: adapter_checkpoint
